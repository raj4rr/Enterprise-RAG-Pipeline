name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: 'maven'

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Run Unit Tests
      run: ./mvnw test --batch-mode --no-transfer-progress

    - name: Package Spring Boot Application
      run: ./mvnw -DskipTests=true package --batch-mode --no-transfer-progress

